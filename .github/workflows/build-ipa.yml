name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string'
        required: true
        default: '0.29.0'
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Godot Engine & Export Templates
        run: |
          set -euxo pipefail
          echo "Downloading Godot 4.3 stable Mono for macOS..."
          curl -fL --retry 3 -o godot_mono_mac.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_macos.universal.zip
          unzip -q godot_mono_mac.zip -d godot_editor

          echo "Downloading Godot 4.3 Mono export templates..."
          curl -fL --retry 3 -o export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_export_templates.tpz
          unzip -q export_templates.tpz -d export_templates_extracted

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          cp -R export_templates_extracted/templates/. "$TEMPLATE_DIR/"

          GODOT_BIN=$(find "$PWD/godot_editor" -type f -path "*/Contents/MacOS/Godot*" | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Inspect Godot project
        run: |
          set -euxo pipefail
          test -f decompiled_project/project.godot
          test -f decompiled_project/export_presets.cfg
          echo '--- export_presets.cfg ---'
          cat decompiled_project/export_presets.cfg
          echo '--- .NET project files ---'
          find decompiled_project -maxdepth 3 \( -name '*.sln' -o -name '*.csproj' \) -print | sort || true

      - name: Export Xcode Project
        id: godot_export
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          "$GODOT_BIN" --headless --verbose --path decompiled_project \
            --export-release "iOS" "$PWD/build/PlantsVsZombies.xcodeproj" \
            2>&1 | tee "$PWD/build/godot-export.log"
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e

          echo "Godot export exit code: $EXPORT_STATUS"
          echo '--- build output ---'
          find build -maxdepth 4 -print | sort | head -n 500 || true

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            exit "$EXPORT_STATUS"
          fi

          test -d build/PlantsVsZombies.xcodeproj
          xcodebuild -list -project build/PlantsVsZombies.xcodeproj 2>&1 | tee build/xcode-project-list.log

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build/godot-export.log
            build/xcode-project-list.log
            decompiled_project/export_presets.cfg
            decompiled_project/project.godot
          if-no-files-found: warn

      - name: Build Xcode Project (Unsigned)
        run: |
          set -euxo pipefail
          xcodebuild -project build/PlantsVsZombies.xcodeproj \
            -scheme PlantsVsZombies \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/archive.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/archive.xcarchive/Products/Applications/*.app Payload/
          zip -r PlantsVsZombies_Hybrid_v0.29.0.ipa Payload
          ls -lh PlantsVsZombies_Hybrid_v0.29.0.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantsVsZombies_Hybrid_v0.29.0.ipa
          path: PlantsVsZombies_Hybrid_v0.29.0.ipa
          if-no-files-found: error
