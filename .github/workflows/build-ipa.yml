name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string'
        required: true
        default: '0.29.0'
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Godot Engine & Export Templates
        run: |
          set -euxo pipefail
          echo "Downloading Godot 4.7 stable Mono for macOS..."
          curl -fL --retry 3 -o godot_mono_mac.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_macos.universal.zip
          unzip -q godot_mono_mac.zip -d godot_editor

          echo "Downloading Godot 4.7 Mono export templates..."
          curl -fL --retry 3 -o export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_export_templates.tpz
          unzip -q export_templates.tpz -d export_templates_extracted

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          cp -R export_templates_extracted/templates/. "$TEMPLATE_DIR/"

          GODOT_BIN=$(find "$PWD/godot_editor" -type f -path "*/Contents/MacOS/Godot*" | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Inspect Godot project
        run: |
          set -euxo pipefail
          test -f decompiled_project/project.godot
          test -f decompiled_project/export_presets.cfg
          echo '--- export_presets.cfg ---'
          cat decompiled_project/export_presets.cfg
          echo '--- .NET project files ---'
          find decompiled_project -maxdepth 3 \( -name '*.sln' -o -name '*.csproj' \) -print | sort || true

      - name: Sanitize recovered Godot resources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/quarantine
          rm -rf decompiled_project/.godot

          python3 - decompiled_project build <<'PY'
          from pathlib import Path
          import shutil
          import struct
          import sys

          project = Path(sys.argv[1]).resolve()
          build = Path(sys.argv[2]).resolve()
          quarantine = build / "quarantine"
          quarantine.mkdir(parents=True, exist_ok=True)
          report = []

          markers = {
              ".tscn": b"[gd_scene",
              ".tres": b"[gd_resource",
              ".gdc": b"GDSC",
              ".res": b"RSRC",
              ".scn": b"RSRC",
              ".png": b"\x89PNG\r\n\x1a\n",
              ".jpg": b"\xff\xd8\xff",
              ".jpeg": b"\xff\xd8\xff",
              ".ogg": b"OggS",
              ".ico": b"\x00\x00\x01\x00",
              ".glb": b"glTF",
          }

          def quarantine_file(path: Path, reason: str) -> None:
              rel = path.relative_to(project)
              dst = quarantine / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(str(path), str(dst))
              report.append(f"QUARANTINE {rel}: {reason}")

          def normalize_png(data: bytes):
              signature = b"\x89PNG\r\n\x1a\n"
              if not data.startswith(signature):
                  return None
              pos = len(signature)
              while pos + 12 <= len(data):
                  length = struct.unpack(">I", data[pos:pos + 4])[0]
                  end = pos + 12 + length
                  if end > len(data):
                      return None
                  chunk_type = data[pos + 4:pos + 8]
                  if chunk_type == b"IEND":
                      return data[:end]
                  pos = end
              return None

          def find_riff(data: bytes, form: bytes) -> int:
              start = 0
              while True:
                  idx = data.find(b"RIFF", start)
                  if idx < 0:
                      return -1
                  if idx + 12 <= len(data) and data[idx + 8:idx + 12] == form:
                      return idx
                  start = idx + 1

          project_binary = project / "project.binary"
          if project_binary.exists():
              quarantine_file(
                  project_binary,
                  "invalid recovered binary project config; project.godot is authoritative",
              )

          for path in sorted(project.rglob("*")):
              if not path.is_file():
                  continue

              rel = path.relative_to(project)
              ext = path.suffix.lower()
              data = path.read_bytes()

              marker = markers.get(ext)
              if marker is not None:
                  idx = data.find(marker)
                  if idx < 0:
                      quarantine_file(path, f"expected {marker!r} header not found")
                      continue

                  fixed = data[idx:]
                  if ext == ".png":
                      normalized = normalize_png(fixed)
                      if normalized is None:
                          quarantine_file(path, "PNG is truncated/corrupt after recovered signature")
                          continue
                      fixed = normalized

                  if idx != 0 or fixed != data:
                      path.write_bytes(fixed)
                      report.append(
                          f"FIX {rel}: stripped {idx} prefix byte(s)"
                          + (f" and {len(data) - idx - len(fixed)} trailing byte(s)" if len(fixed) != len(data) - idx else "")
                      )
                  continue

              if ext in {".wav", ".webp"}:
                  form = b"WAVE" if ext == ".wav" else b"WEBP"
                  idx = find_riff(data, form)
                  if idx < 0:
                      quarantine_file(path, f"valid RIFF/{form.decode()} header not found")
                  elif idx != 0:
                      path.write_bytes(data[idx:])
                      report.append(f"FIX {rel}: stripped {idx} prefix byte(s)")
                  continue

              if ext == ".gd":
                  # Source GDScript should be text. Binary/tokenized scripts belong in .gdc.
                  if b"\x00" in data:
                      quarantine_file(path, "NUL bytes found in GDScript source")
                      continue
                  try:
                      data.decode("utf-8")
                  except UnicodeDecodeError:
                      quarantine_file(path, "GDScript source is not valid UTF-8")

          report_path = build / "sanitize-report.txt"
          report_path.write_text("\n".join(report) + ("\n" if report else "No repairs needed.\n"), encoding="utf-8")
          print(report_path.read_text(encoding="utf-8"))
          print(f"Sanitizer actions: {len(report)}")
          PY

      - name: Configure unsigned iOS project export
        shell: bash
        run: |
          set -euxo pipefail
          python3 - decompiled_project/export_presets.cfg <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          options_header = "[preset.0.options]"
          if options_header not in text:
              raise SystemExit("iOS preset options section not found")

          # Godot requires a syntactically valid 10-character Team ID even when
          # we only generate an Xcode project. This placeholder is never used
          # for signing; the Xcode build below explicitly disables code signing.
          if not re.search(r"(?m)^application/app_store_team_id=", text):
              text = text.replace(
                  options_header,
                  options_header + '\n\napplication/app_store_team_id="AAAAAAAAAA"',
                  1,
              )

          key = "application/export_project_only"
          if re.search(rf"(?m)^{re.escape(key)}=", text):
              text = re.sub(rf"(?m)^{re.escape(key)}=.*$", key + "=true", text, count=1)
          else:
              text = text.replace(
                  options_header,
                  options_header + "\n\n" + key + "=true",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("--- CI iOS export overrides ---")
          for line in text.splitlines():
              if line.startswith("application/app_store_team_id=") or line.startswith("application/export_project_only="):
                  print(line)
          PY

      - name: Export Xcode Project
        id: godot_export
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          "$GODOT_BIN" --headless --verbose --path decompiled_project \
            --export-release "iOS" "$PWD/build/PlantsVsZombies.xcodeproj" \
            2>&1 | tee "$PWD/build/godot-export.log"
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e

          echo "Godot export exit code: $EXPORT_STATUS"
          echo '--- build output ---'
          find build -maxdepth 4 -print | sort | head -n 500 || true

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            exit "$EXPORT_STATUS"
          fi

          test -d build/PlantsVsZombies.xcodeproj
          xcodebuild -list -project build/PlantsVsZombies.xcodeproj 2>&1 | tee build/xcode-project-list.log

      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build/godot-export.log
            build/xcode-project-list.log
            build/sanitize-report.txt
            build/quarantine
            decompiled_project/export_presets.cfg
            decompiled_project/project.godot
          if-no-files-found: warn

      - name: Build Xcode Project (Unsigned)
        run: |
          set -euxo pipefail
          xcodebuild -project build/PlantsVsZombies.xcodeproj \
            -scheme PlantsVsZombies \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/archive.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euxo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/archive.xcarchive/Products/Applications/*.app Payload/
          zip -r PlantsVsZombies_Hybrid_v0.29.0.ipa Payload
          ls -lh PlantsVsZombies_Hybrid_v0.29.0.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantsVsZombies_Hybrid_v0.29.0.ipa
          path: PlantsVsZombies_Hybrid_v0.29.0.ipa
          if-no-files-found: error
